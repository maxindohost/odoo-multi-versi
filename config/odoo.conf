[options]
admin_passwd = admin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; core, enterprise (opsional), lalu addon custom Anda
addons_path = /opt/odoo/addons,/opt/odoo/odoo/addons,/opt/enterprise,/mnt/extra-addons
data_dir = /var/lib/odoo

http_port = 8069
workers = 0
list_db = True
log_level = info

; auto-reload python + qweb + xml saat file disimpan
dev_mode = reload,qweb,xml
