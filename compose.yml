# Satu stack per versi Odoo (project name: odoo<versi>), dikendalikan lewat Makefile.
services:
  db:
    image: postgres:${PG_VERSION:-16}
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5417}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 20

  odoo:
    image: odoo-dev:${ODOO_VERSION:-17.0}
    build:
      context: ./docker
      additional_contexts:
        odoo_src: ./src/${ODOO_VERSION:-17.0}/odoo
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        UBUNTU_CODENAME: ${UBUNTU_CODENAME:-jammy}
        PG_VERSION: ${PG_VERSION:-16}
        WKHTMLTOPDF_VERSION: ${WKHTMLTOPDF_VERSION:-0.12.6.1-3}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEBUGPY: ${DEBUGPY:-0}
      DEBUGPY_WAIT: ${DEBUGPY_WAIT:-0}
    ports:
      - "127.0.0.1:${ODOO_PORT:-8017}:8069"
      - "127.0.0.1:${DEBUG_PORT:-5617}:5678"
    volumes:
      - ./src/${ODOO_VERSION:-17.0}/odoo:/opt/odoo
      - ./src/${ODOO_VERSION:-17.0}/enterprise:/opt/enterprise
      - ./addons/${ODOO_VERSION:-17.0}:/mnt/extra-addons
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
